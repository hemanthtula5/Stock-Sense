<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move History</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><aside class="sidebar"><div class="brand">📦 StockSense</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="receipts.html">Receipts</a><a href="deliveries.html">Deliveries</a><a href="transfers.html">Transfers</a><a href="adjustments.html">Adjustments</a><a href="ledger.html">Move History</a><a href="warehouses.html">Warehouses</a><a href="profile.html">Profile</a></nav><div class="p-3 position-absolute bottom-0 w-100"><button id="logout" class="btn btn-light w-100">Logout</button></div></aside><main class="main"><header class="top"><b>Stock Ledger</b><div class="avatar">SS</div></header><section class="content"><h1 class="h3 fw-bold">Move History</h1><div class="panel mt-4"><div class="panel-body"><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Reference</th><th>Product</th><th>From</th><th>To</th><th>Qty</th><th>Movement</th><th>User</th></tr></thead><tbody id="body"></tbody></table></div></div></div></section></main><script src="js/common.js"></script><script>guard();layout();api('/ledger').then(d=>body.innerHTML=d.ledger.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('en-IN')}</td><td>${esc(x.reference_number)}</td><td>${esc(x.product_name)}</td><td>${esc(x.from_location||'-')}</td><td>${esc(x.to_location||'-')}</td><td>${num(x.quantity)}</td><td>${esc(x.movement_type)}</td><td>${esc(x.user_name||'-')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No ledger entries.</td></tr>').catch(e=>toast(e.message,'danger'))</script></body></html>
