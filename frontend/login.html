<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | StockSense</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div class="min-vh-100 d-flex align-items-center justify-content-center p-3"><div class="card border-0 shadow-sm" style="max-width:420px;width:100%"><div class="card-body p-4"><h2 class="fw-bold">StockSense</h2><p class="text-muted">Inventory Management System</p><form id="f"><input id="email" type="email" class="form-control mb-3" placeholder="Email" required><input id="password" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form><div class="text-center mt-3"><a href="signup.html">Create account</a> · <a href="forgot-password.html">Reset password</a></div></div></div></div><script src="js/common.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem('ss_token',d.token);localStorage.setItem('ss_user',JSON.stringify(d.user));location.href='/dashboard.html'}catch(x){toast(x.message,'danger')}}</script></body></html>
