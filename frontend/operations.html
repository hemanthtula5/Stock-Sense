<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations | StockSense</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><aside class="sidebar"><div class="brand">📦 StockSense</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="receipts.html">Receipts</a><a href="deliveries.html">Deliveries</a><a href="transfers.html">Transfers</a><a href="adjustments.html">Adjustments</a><a href="ledger.html">Move History</a><a href="warehouses.html">Warehouses</a></nav><div class="p-3 position-absolute bottom-0 w-100"><button id="logout" class="btn btn-light w-100">Logout</button></div></aside><main class="main"><header class="top"><button id="menu" class="btn btn-light mobile">☰</button><b id="title">Operations</b><div class="avatar">SS</div></header><section class="content"><h1 class="h3 fw-bold" id="heading">Operations</h1><div class="panel mt-3"><div class="panel-body"><div class="row g-2"><div class="col-md-3"><select id="source" class="form-select"><option value="">Source Location</option></select></div><div class="col-md-3"><select id="destination" class="form-select"><option value="">Destination Location</option></select></div><div class="col-md-3"><select id="product" class="form-select"><option value="">Product</option></select></div><div class="col-md-2"><input id="qty" type="number" min="0.01" step="0.01" class="form-control" placeholder="Quantity"></div><div class="col-md-1"><button id="add" class="btn btn-primary w-100">+</button></div></div><div id="items" class="mt-3"></div><input id="partner" class="form-control mt-2" placeholder="Supplier / Customer"><textarea id="notes" class="form-control mt-2" placeholder="Notes"></textarea><button id="create" class="btn btn-primary mt-3">Create Operation</button></div></div><div class="panel mt-4"><div class="panel-head"><b>Operations</b></div><div class="table-responsive"><table class="table"><thead><tr><th>Reference</th><th>Status</th><th>From</th><th>To</th><th>Date</th><th></th></tr></thead><tbody id="body"></tbody></table></div></div></section></main><script src="js/common.js"></script><script>guard();layout();const type=new URLSearchParams(location.search).get('type')||'RECEIPT';const route={RECEIPT:'receipts',DELIVERY:'deliveries',TRANSFER:'transfers',ADJUSTMENT:'adjustments'}[type];heading.textContent={RECEIPT:'Receipts',DELIVERY:'Delivery Orders',TRANSFER:'Internal Transfers',ADJUSTMENT:'Inventory Adjustments'}[type];let items=[];async function init(){const[p,l]=await Promise.all([api('/products'),api('/locations')]);product.innerHTML='<option value="">Product</option>'+p.products.map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.sku)})</option>`).join('');source.innerHTML='<option value="">Source Location</option>'+l.locations.map(x=>`<option value="${x.id}">${esc(x.warehouse_name)} / ${esc(x.name)}</option>`).join('');destination.innerHTML='<option value="">Destination Location</option>'+l.locations.map(x=>`<option value="${x.id}">${esc(x.warehouse_name)} / ${esc(x.name)}</option>`).join('');if(type==='RECEIPT')source.disabled=true;if(type==='DELIVERY'||type==='ADJUSTMENT')destination.disabled=true;add.onclick=()=>{if(!product.value||Number(qty.value)<=0)return toast('Select product and positive quantity','danger');items.push({product_id:Number(product.value),quantity:Number(qty.value)});renderItems()};create.onclick=async()=>{if(!items.length)return toast('Add an item','danger');if(type==='RECEIPT'&&!destination.value)return toast('Select destination','danger');if(type!=='RECEIPT'&&!source.value)return toast('Select source','danger');if(type==='TRANSFER'&&!destination.value)return toast('Select destination','danger');try{await api('/operations/'+route,{method:'POST',body:JSON.stringify({source_location_id:source.value||null,destination_location_id:destination.value||null,partner_name:partner.value,notes:notes.value,items})});items=[];renderItems();await load();toast('Operation created')}catch(e){toast(e.message,'danger')}};load()}function renderItems(){itemsEl=document.getElementById('items');itemsEl.innerHTML=items.map((x,i)=>`<div class="border rounded p-2 mb-2">Product ID ${x.product_id} — ${x.quantity} <button class="btn btn-sm btn-link text-danger" onclick="items.splice(${i},1);renderItems()">remove</button></div>`).join('')}async function load(){const d=await api('/operations/'+route);body.innerHTML=d.operations.map(x=>`<tr><td>${esc(x.reference_number)}</td><td>${badge(x.status)}</td><td>${esc(x.source_location||'-')}</td><td>${esc(x.destination_location||'-')}</td><td>${new Date(x.created_at).toLocaleDateString('en-IN')}</td><td>${x.status!=='DONE'&&x.status!=='CANCELED'?`<button class="btn btn-sm btn-success" onclick="validateOp(${x.id})">Validate</button> <button class="btn btn-sm btn-outline-danger" onclick="cancelOp(${x.id})">Cancel</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No operations.</td></tr>'}async function validateOp(id){try{await api('/operations/'+id+'/validate',{method:'POST'});toast('Operation validated');load()}catch(e){toast(e.message,'danger')}}async function cancelOp(id){try{await api('/operations/'+id+'/cancel',{method:'POST'});load()}catch(e){toast(e.message,'danger')}}init()</script></body></html>
