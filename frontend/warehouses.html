<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warehouses</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><aside class="sidebar"><div class="brand">📦 StockSense</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="receipts.html">Receipts</a><a href="deliveries.html">Deliveries</a><a href="transfers.html">Transfers</a><a href="adjustments.html">Adjustments</a><a href="ledger.html">Move History</a><a href="warehouses.html">Warehouses</a><a href="profile.html">Profile</a></nav><div class="p-3 position-absolute bottom-0 w-100"><button id="logout" class="btn btn-light w-100">Logout</button></div></aside><main class="main"><header class="top"><b>Warehouses</b><div class="avatar">SS</div></header><section class="content"><div class="d-flex justify-content-between"><h1 class="h3 fw-bold">Warehouses</h1><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m">+ Warehouse</button></div><div class="row g-3 mt-2" id="cards"></div><div class="panel mt-4"><div class="panel-head"><b>Locations</b></div><div class="table-responsive"><table class="table"><thead><tr><th>Warehouse</th><th>Location</th><th>Code</th></tr></thead><tbody id="loc"></tbody></table></div></div></section></main><div class="modal fade" id="m"><div class="modal-dialog"><div class="modal-content"><form id="f"><div class="modal-body"><input id="name" class="form-control mb-2" placeholder="Warehouse name" required><input id="code" class="form-control mb-2" placeholder="Code" required><input id="address" class="form-control" placeholder="Address"></div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/common.js"></script><script>guard();layout();async function load(){try{const[w,l]=await Promise.all([api('/warehouses'),api('/locations')]);cards.innerHTML=w.warehouses.map(x=>`<div class="col-md-6"><div class="cardx"><h5>${esc(x.name)}</h5><div class="muted">${esc(x.code)} · ${esc(x.address||'')}</div></div></div>`).join('');loc.innerHTML=l.locations.map(x=>`<tr><td>${esc(x.warehouse_name)}</td><td>${esc(x.name)}</td><td>${esc(x.code)}</td></tr>`).join('')}catch(e){toast(e.message,'danger')}}f.onsubmit=async e=>{e.preventDefault();try{await api('/warehouses',{method:'POST',body:JSON.stringify({name:name.value,code:code.value,address:address.value})});bootstrap.Modal.getInstance(document.getElementById('m')).hide();f.reset();load()}catch(x){toast(x.message,'danger')}};load()</script></body></html>
