<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div class="min-vh-100 d-flex align-items-center justify-content-center p-3"><div class="card border-0 shadow-sm" style="max-width:460px;width:100%"><div class="card-body p-4"><h3>Reset Password</h3><input id="email" class="form-control mb-2" placeholder="Email"><button id="send" class="btn btn-outline-primary w-100 mb-3">Generate OTP</button><div id="dev" class="alert alert-info d-none"></div><form id="f"><input id="otp" class="form-control mb-2" placeholder="OTP"><input id="password" type="password" minlength="6" class="form-control mb-3" placeholder="New Password"><button class="btn btn-primary w-100">Reset</button></form><div class="text-center mt-3"><a href="login.html">Login</a></div></div></div></div><script src="js/common.js"></script><script>send.onclick=async()=>{try{const d=await api('/auth/forgot-password',{method:'POST',body:JSON.stringify({email:email.value})});dev.classList.remove('d-none');dev.textContent='Development OTP: '+d.developmentOtp}catch(e){toast(e.message,'danger')}};f.onsubmit=async e=>{e.preventDefault();try{await api('/auth/reset-password',{method:'POST',body:JSON.stringify({email:email.value,otp:otp.value,password:password.value})});toast('Password reset');setTimeout(()=>location.href='/login.html',700)}catch(x){toast(x.message,'danger')}}</script></body></html>
