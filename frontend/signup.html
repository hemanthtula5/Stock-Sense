<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockSense - Sign Up</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">StockSense</h2>
                        <p class="text-muted">Create your account</p>
                    </div>

                    <form id="signupForm">

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter your name"
                                required
                            >
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <!-- Role -->
                        <div class="mb-3">
                            <label class="form-label">Role</label>

                            <select id="role" class="form-select" required>
                                <option value="Inventory Manager">
                                    Inventory Manager
                                </option>

                                <option value="Warehouse Staff">
                                    Warehouse Staff
                                </option>

                                <option value="Admin">
                                    Admin
                                </option>
                            </select>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter password"
                                required
                            >
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Confirm password"
                                required
                            >
                        </div>

                        <!-- Message -->
                        <div id="message" class="mb-3"></div>

                        <!-- Button -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create Account
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <span class="text-muted">
                            Already have an account?
                        </span>

                        <a href="/login.html">
                            Login
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>


<script>

document.getElementById("signupForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();

    const email = document.getElementById("email").value.trim();

    const role = document.getElementById("role").value;

    const password = document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    // Check password
    if (password !== confirmPassword) {

        message.innerHTML =
            '<div class="alert alert-danger">Passwords do not match</div>';

        return;
    }


    // Check password length
    if (password.length < 6) {

        message.innerHTML =
            '<div class="alert alert-danger">Password must be at least 6 characters</div>';

        return;
    }


    try {

        const response = await fetch("/api/auth/signup", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                role: role
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.message || "Signup failed"
            );

        }


        message.innerHTML =
            '<div class="alert alert-success">Account created successfully!</div>';


        setTimeout(function() {

            window.location.href = "/login.html";

        }, 1000);


    } catch (error) {

        message.innerHTML =
            '<div class="alert alert-danger">' +
            error.message +
            '</div>';

    }

});

</script>

</body>
</html>
