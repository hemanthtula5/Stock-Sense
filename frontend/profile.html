<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><aside class="sidebar"><div class="brand">📦 StockSense</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="receipts.html">Receipts</a><a href="deliveries.html">Deliveries</a><a href="transfers.html">Transfers</a><a href="adjustments.html">Adjustments</a><a href="ledger.html">Move History</a><a href="warehouses.html">Warehouses</a><a href="profile.html">Profile</a></nav><div class="p-3 position-absolute bottom-0 w-100"><button id="logout" class="btn btn-light w-100">Logout</button></div></aside><main class="main"><header class="top"><b>My Profile</b></header><section class="content"><div class="panel" style="max-width:650px"><div class="panel-body"><h3 id="name">User</h3><p class="text-muted" id="role"></p><hr><dl class="row"><dt class="col-sm-4">Email</dt><dd class="col-sm-8" id="email"></dd><dt class="col-sm-4">Created</dt><dd class="col-sm-8" id="created"></dd></dl></div></div></section></main><script src="js/common.js"></script><script>guard();layout();api('/profile').then(d=>{name.textContent=d.user.name;role.textContent=d.user.role;email.textContent=d.user.email;created.textContent=new Date(d.user.created_at).toLocaleDateString('en-IN')}).catch(e=>toast(e.message,'danger'))</script></body></html>
