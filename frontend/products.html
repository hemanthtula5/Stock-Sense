<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><aside class="sidebar"><div class="brand">📦 StockSense</div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="receipts.html">Receipts</a><a href="deliveries.html">Deliveries</a><a href="transfers.html">Transfers</a><a href="adjustments.html">Adjustments</a><a href="ledger.html">Move History</a><a href="warehouses.html">Warehouses</a><a href="profile.html">Profile</a></nav><div class="p-3 position-absolute bottom-0 w-100"><button id="logout" class="btn btn-light w-100">Logout</button></div></aside><main class="main"><header class="top"><button id="menu" class="btn btn-light mobile">☰</button><div class="fw-bold">Products</div><div class="avatar" id="avatar">AU</div></header><section class="content"><div class="d-flex justify-content-between mb-4"><div><h1 class="h3 fw-bold">Products</h1><div class="muted">Create and manage inventory products.</div></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m">+ Add Product</button></div><div class="panel"><div class="panel-body"><input id="search" class="form-control mb-3" placeholder="Search product or SKU"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Unit</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="body"></tbody></table></div></div></div></section></main><div class="modal fade" id="m"><div class="modal-dialog"><div class="modal-content"><form id="f"><div class="modal-header"><h5>Product</h5></div><div class="modal-body"><input id="name" class="form-control mb-2" placeholder="Name" required><input id="sku" class="form-control mb-2" placeholder="SKU e.g. PROD-STEEL-01" required><select id="cat" class="form-select mb-2"></select><input id="unit" class="form-control mb-2" value="pcs" placeholder="Unit"><input id="reorder" type="number" min="0" class="form-control mb-2" placeholder="Reorder Level"><textarea id="desc" class="form-control" placeholder="Description"></textarea></div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/common.js"></script><script>guard();layout();let rows=[];async function load(){const[p,c]=await Promise.all([api('/products'),api('/categories')]);rows=p.products;cat.innerHTML='<option value="">No category</option>'+c.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');render()}function render(){const q=search.value.toLowerCase();body.innerHTML=rows.filter(x=>!q||x.name.toLowerCase().includes(q)||x.sku.toLowerCase().includes(q)).map(x=>{const s=Number(x.total_stock)<=0?'Out of Stock':Number(x.total_stock)<=Number(x.reorder_level)?'Low Stock':'In Stock';return `<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.category_name||'-')}</td><td>${esc(x.unit_of_measure)}</td><td>${num(x.total_stock)}</td><td class="${s==='In Stock'?'text-success':s==='Low Stock'?'text-warning':'text-danger'} fw-semibold">${s}</td><td><button class="btn btn-sm btn-light" onclick="del(${x.id})">Delete</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No products.</td></tr>'}f.onsubmit=async e=>{e.preventDefault();try{await api('/products',{method:'POST',body:JSON.stringify({name:name.value,sku:sku.value,category_id:cat.value||null,unit_of_measure:unit.value,reorder_level:Number(reorder.value||0),description:desc.value})});bootstrap.Modal.getInstance(document.getElementById('m')).hide();f.reset();load();toast('Product created')}catch(x){toast(x.message,'danger')}};async function del(id){if(confirm('Delete product?')){try{await api('/products/'+id,{method:'DELETE'});load()}catch(e){toast(e.message,'danger')}}}search.oninput=render;load()</script></body></html>
